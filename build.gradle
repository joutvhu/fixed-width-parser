plugins {
    id 'java'
    id 'idea'
    id 'groovy'
    id 'signing'
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.joutvhu'
version '1.1.5'

def snapshotVersion = version.endsWith('-SNAPSHOT') || version.endsWith('.SNAPSHOT')

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    versions = [
            'commons-lang3.version': '3.18.0',
            're2j.version': '1.4',
            'reflections.version': '0.9.12',
            'jackson.version': '2.11.2'
    ]
    managedVersions = [
            'org.apache.commons:commons-lang3': 'commons-lang3.version',
            'com.google.re2j:re2j': 're2j.version',
            'org.reflections:reflections': 'reflections.version',
            'com.fasterxml.jackson.core:jackson-core': 'jackson.version',
            'com.fasterxml.jackson.core:jackson-databind': 'jackson.version',
            'com.fasterxml.jackson.datatype:jackson-datatype-jdk8': 'jackson.version',
            'com.fasterxml.jackson.datatype:jackson-datatype-jsr310': 'jackson.version'
    ]
}

dependencyManagement {
    dependencies {
        ext.managedVersions.each {
            dependency "${it.key}:${ext.versions[it.value]}"
        }
    }
}

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    compileOnly 'org.projectlombok:lombok:1.18.36'

    implementation 'org.apache.commons:commons-lang3'
    implementation "com.google.re2j:re2j"
    implementation "org.reflections:reflections"

    implementation "com.fasterxml.jackson.core:jackson-core"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'

    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
}

jar {
    manifest {
        attributes 'Built-By': 'joutvhu (Giao Ho)'
    }
    into("META-INF/maven/${project.group}/${project.name}") {
        from {
            generatePomFileForMavenPublication
        }
        rename {
            it.replace('pom-default.xml', 'pom.xml')
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:-options'])
    if (name.contains("Test")) {
        options.release.set(21)
    } else {
        options.release.set(8)
    }
}

tasks.register('fatJar', Jar) {
    archiveClassifier.set('fat')
    manifest.from jar.manifest
    with jar
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

artifacts {
    archives tasks.fatJar, tasks.sourcesJar, tasks.javadocJar
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
    filter {
        includeTestsMatching 'com.joutvhu.fixedwidth.parser.*'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = group
            artifactId = project.name
            artifacts = [fatJar, sourcesJar, javadocJar]
            version = version

            pom {
                name = project.name
                description = 'Parse fixed width string to object and export object to fixed width string'
                url = 'https://github.com/joutvhu/fixed-width-parser'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/joutvhu/fixed-width-parser/blob/master/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'joutvhu'
                        name = 'Giao Ho'
                        email = 'joutvhu@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git@github.com:joutvhu/fixed-width-parser.git'
                    developerConnection = 'scm:git:git@github.com:joutvhu/fixed-width-parser.git'
                    url = 'https://github.com/joutvhu/fixed-width-parser'
                }
                issueManagement {
                    system = 'Github Issue'
                    url = 'https://github.com/joutvhu/fixed-width-parser/issues'
                }
                organization {
                    name = 'Giao Ho'
                    url = 'https://github.com/joutvhu'
                }
                properties = project.ext.versions instanceof Map ? project.ext.versions : new HashMap<>()
                withXml {
                    def pomNode = asNode();
                    def dependencyManagement = pomNode.get('dependencyManagement')
                    if (dependencyManagement.dependencies.dependency.isEmpty()) {
                        pomNode.remove(dependencyManagement)
                    } else {
                        dependencyManagement.dependencies.dependency.each {
                            def key = "${it.groupId.text()}:${it.artifactId.text()}"
                            def versionProperty = project.ext.managedVersions[key]
                            if (versionProperty == null) {
                                versionProperty = project.ext.otherVersions[key]
                            }
                            if (versionProperty) {
                                it.version[0].setValue("\${$versionProperty}")
                            }
                        }
                    }

                    def dependenciesNode = pomNode.appendNode('dependencies')
                    if (configurations.implementation.allDependencies.isEmpty()) {
                        pomNode.remove(dependenciesNode)
                    } else {
                        configurations.implementation.allDependencies.each {
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', it.group)
                            dependencyNode.appendNode('artifactId', it.name)
                            if (it.version != null) {
                                dependencyNode.appendNode('version', it.version)
                            }
                        }
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'sonatype'
            if (snapshotVersion) {
                url = 'https://oss.sonatype.org/content/repositories/snapshots'
            } else {
                url = 'https://oss.sonatype.org/service/local/staging/deploy/maven2'
            }
            credentials {
                username = project.findProperty('ossrhUsername') ?: ""
                password = project.findProperty('ossrhPassword') ?: ""
            }
        }
        maven {
            name = 'github'
            url = "https://maven.pkg.github.com/joutvhu/fixed-width-parser"
            credentials {
                username = project.findProperty('githubUsername') ?: ""
                password = project.findProperty('githubPassword') ?: ""
            }
        }
    }
}

signing {
    if (project.hasProperty('signing.keyId')) {
        sign publishing.publications.maven
    }
}

tasks.publishMavenPublicationToGithubRepository.configure {
    onlyIf { !snapshotVersion }
}
